<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestión de usuarios de Aula Clara">
  <title>Usuarios | Aula Clara</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="usuarios">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span class="brand-mark">AV</span><div><strong>Aula Clara</strong><small>Valle Verde</small></div></div>
      <nav aria-label="Navegación principal">
        <a class="nav-item" href="inicio.html"><span>⌂</span> Inicio</a>
        <a class="nav-item active" href="usuarios.html" aria-current="page"><span>♙</span> Usuarios</a>
        <button class="nav-item" type="button"><span>▤</span> Académico</button>
        <button class="nav-item" type="button"><span>◇</span> Comunicados <b class="badge">3</b></button>
      </nav>
      <div class="sidebar-foot"><small>Centro educativo público</small><strong>Curso lectivo 2026</strong><span>Versión 1.0.0</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" class="menu-button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="crumb"><span>Intranet</span> / <strong>Usuarios</strong></div>
        <div class="top-actions"><button class="notification" aria-label="3 notificaciones">♢<b>3</b></button><div class="user-chip"><span id="avatar"></span><div><strong id="user-name"></strong><small id="user-role"></small></div></div><button id="logout" class="logout" title="Cerrar sesión" aria-label="Cerrar sesión">↪</button></div>
      </header>
      <main id="contenido" tabindex="-1">
        <section aria-labelledby="usuarios-title">
          <div class="page-title"><div><p class="eyebrow">Administración</p><h1 id="usuarios-title">Gestión de usuarios</h1><p>Personas con acceso a la intranet.</p></div><button class="primary" id="new-user">+ Nueva persona</button></div>
          <section class="panel table-panel" aria-label="Listado de usuarios"><div class="filters"><label class="search"><span aria-hidden="true">⌕</span><input id="user-search" type="search" placeholder="Buscar por nombre o correo" aria-label="Buscar usuarios"></label><select id="role-filter" aria-label="Filtrar por perfil"><option value="all">Todos los perfiles</option><option value="Administración">Administración</option><option value="Docente">Docente</option><option value="Estudiante / familia">Estudiante / familia</option></select></div><div class="table-wrap"><table><thead><tr><th>Persona</th><th>Perfil</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="users-body"></tbody></table></div></section>
        </section>
      </main>
    </div>
  </div>
  <dialog id="modal"><form method="dialog" id="modal-form"><div class="modal-head"><div><p class="eyebrow" id="modal-eyebrow"></p><h2 id="modal-title"></h2></div><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div><div id="modal-fields"></div><div class="modal-actions"><button value="cancel" class="secondary">Cancelar</button><button value="default" id="modal-submit" class="primary">Guardar</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
