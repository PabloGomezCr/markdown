<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de inicio de Aula Clara">
  <title>Inicio | Aula Clara</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="inicio">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span class="brand-mark">AV</span><div><strong>Aula Clara</strong><small>Valle Verde</small></div></div>
      <nav aria-label="Navegación principal">
        <a class="nav-item active" href="inicio.html" aria-current="page"><span>⌂</span> Inicio</a>
        <a class="nav-item role-admin" href="usuarios.html"><span>♙</span> Usuarios</a>
        <button class="nav-item" type="button"><span>▤</span> Académico</button>
        <button class="nav-item" type="button"><span>◇</span> Comunicados <b class="badge">3</b></button>
      </nav>
      <div class="sidebar-foot"><small>Centro educativo público</small><strong>Curso lectivo 2026</strong><span>Versión 1.0.0</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" class="menu-button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="crumb"><span>Intranet</span> / <strong>Inicio</strong></div>
        <div class="top-actions"><button class="notification" aria-label="3 notificaciones">♢<b>3</b></button><div class="user-chip"><span id="avatar"></span><div><strong id="user-name"></strong><small id="user-role"></small></div></div><button id="logout" class="logout" title="Cerrar sesión" aria-label="Cerrar sesión">↪</button></div>
      </header>
      <main id="contenido" tabindex="-1">
        <section aria-labelledby="inicio-title">
          <div class="welcome panel dark">
            <div><p id="today" class="eyebrow"></p><h1 id="inicio-title">Buenos días, <span id="first-name"></span>.</h1><p id="welcome-copy"></p></div>
            <div class="school-seal" aria-hidden="true">✦<small>Valle Verde<br>1987</small></div>
          </div>
          <div class="stats" id="stats"></div>
          <div class="dashboard-grid">
            <section class="panel"><div class="section-head"><div><p class="eyebrow">Esta semana</p><h2>Próximas actividades</h2></div><button class="text-button" type="button">Ver calendario →</button></div><div id="activities"></div></section>
            <section class="panel"><div class="section-head"><div><p class="eyebrow">Centro educativo</p><h2>Comunicados recientes</h2></div><button class="text-button" type="button">Ver todos →</button></div><div id="recent-posts"></div></section>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
